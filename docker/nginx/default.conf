# nginx vhost fronting the PHP-FPM WordPress container.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.php;

    client_max_body_size 64M;

    # Security headers (lean baseline; applied to every response incl. errors).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Hardening — these MUST precede the generic `location ~ \.php$` block.
    # nginx picks the FIRST matching regex location in file order, so the deny
    # rules below have to come first or the generic PHP handler shadows them and
    # they never fire (the bug this hardening fixes).

    # No PHP execution from upload/content/include dirs (defense vs. uploaded shells).
    location ~* ^/wp-content/uploads/.*\.php$ { deny all; }
    location ~* /(?:wp-content|wp-includes)/.*\.php$ { deny all; }

    # Block hidden files (except ACME), sensitive config, logs, and CMS fingerprints.
    location ~ /\.(?!well-known) { deny all; }
    location = /wp-config.php { deny all; }
    location ~* \.log$ { deny all; }
    location = /readme.html { deny all; }
    location = /license.txt { deny all; }

    # Static assets — long cache, served straight from disk.
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico|map)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }
}
