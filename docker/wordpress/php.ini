; BuckleUp dev PHP settings
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 300
max_input_vars = 5000
display_errors = Off
log_errors = On

; OPcache — fast but revalidates so theme/plugin edits show immediately in dev
opcache.enable = 1
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
