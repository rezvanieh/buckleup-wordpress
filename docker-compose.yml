# BuckleUp WordPress — local development stack
# Run:  cp .env.example .env  &&  docker compose up -d  &&  ./scripts/provision.sh
#
# Services:
#   nginx       -> http://localhost:8080            (web entrypoint)
#   wordpress   -> PHP 8.3-FPM (WordPress 6.9)
#   db          -> MariaDB 11.4 LTS
#   redis       -> object cache backend
#   adminer     -> http://localhost:8081            (DB GUI)
#   mailpit     -> http://localhost:8025            (caught email UI; SMTP :1025)
#   wpcli       -> one-shot WP-CLI runner (profile: cli)
#   assets      -> Node 22 theme asset builder      (profile: assets)
#
# Networks: a single private bridge. Only nginx/adminer/mailpit publish ports.

name: buckleup

services:
  db:
    image: mariadb:11.4
    container_name: buckleup-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-buckleup}
      MARIADB_USER: ${DB_USER:-buckleup}
      MARIADB_PASSWORD: ${DB_PASSWORD:-buckleup}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [buckleup]

  redis:
    image: redis:7-alpine
    container_name: buckleup-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [buckleup]

  wordpress:
    build:
      context: ./docker/wordpress
      args:
        WP_VERSION: ${WP_VERSION:-6.9}
        PHP_VERSION: ${PHP_VERSION:-8.3}
    container_name: buckleup-wp
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-buckleup}
      WORDPRESS_DB_USER: ${DB_USER:-buckleup}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-buckleup}
      WORDPRESS_TABLE_PREFIX: ${DB_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${WP_DEBUG:-1}
      # Injected verbatim into wp-config.php via WORDPRESS_CONFIG_EXTRA
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME',    '${WP_HOME:-http://localhost:8080}');
        define('WP_SITEURL', '${WP_HOME:-http://localhost:8080}');
        define('WP_DEBUG_LOG',     true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG',     true);
        define('DISALLOW_FILE_EDIT', true);
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('FS_METHOD', 'direct');
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_AUTO_UPDATE_CORE', false);
        // Redis object cache (Redis Object Cache plugin)
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_REDIS_PREFIX', 'buckleup:');
        define('WP_CACHE', true);
        // Route all wp_mail() through Mailpit
        define('WPMS_ON', true);
    volumes:
      - wp-core:/var/www/html
      # Version-controlled theme + plugin bind-mounted over the volume
      - ./wp-content/themes/buckleup:/var/www/html/wp-content/themes/buckleup
      - ./wp-content/plugins/buckleup-core:/var/www/html/wp-content/plugins/buckleup-core
      # mu-plugin to force SMTP -> Mailpit (no UI config needed)
      - ./docker/wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins
    networks: [buckleup]

  nginx:
    image: nginx:1.27-alpine
    container_name: buckleup-nginx
    restart: unless-stopped
    depends_on: [wordpress]
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - wp-core:/var/www/html:ro
      - ./wp-content/themes/buckleup:/var/www/html/wp-content/themes/buckleup:ro
      - ./wp-content/plugins/buckleup-core:/var/www/html/wp-content/plugins/buckleup-core:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [buckleup]

  adminer:
    image: adminer:5
    container_name: buckleup-adminer
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    networks: [buckleup]

  mailpit:
    image: axllent/mailpit:latest
    container_name: buckleup-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"   # web UI
    networks: [buckleup]

  # ----- one-shot / on-demand services (not started by `up`) -----

  wpcli:
    image: wordpress:cli-php8.3
    container_name: buckleup-wpcli
    profiles: ["cli"]
    depends_on:
      db: { condition: service_healthy }
    user: "33:33"  # www-data, matches the wordpress image
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-buckleup}
      WORDPRESS_DB_USER: ${DB_USER:-buckleup}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-buckleup}
    volumes:
      - wp-core:/var/www/html
      - ./wp-content/themes/buckleup:/var/www/html/wp-content/themes/buckleup
      - ./wp-content/plugins/buckleup-core:/var/www/html/wp-content/plugins/buckleup-core
      - ./scripts:/scripts:ro
      - ./wp-data:/wp-data
    networks: [buckleup]

  assets:
    image: node:22-alpine
    container_name: buckleup-assets
    profiles: ["assets"]
    working_dir: /theme
    command: ["sh", "-c", "npm install && npm run dev"]
    volumes:
      - ./wp-content/themes/buckleup:/theme
      - theme-node-modules:/theme/node_modules
    networks: [buckleup]

volumes:
  db-data:
  wp-core:
  theme-node-modules:

networks:
  buckleup:
    driver: bridge
