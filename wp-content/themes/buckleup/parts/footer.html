<!-- Site footer is authored in Elementor (library template "Site Footer") and embedded
     here so it renders site-wide and stays Elementor-editable. Referenced by SLUG, not
     id: build-chrome.php creates the template and the id it lands on differs between
     installs (it was 164 on the original build). The original buckleup/section
     site-footer pattern is retained in patterns/ but no longer referenced. -->
<!-- wp:shortcode -->
[buckleup_elementor slug="site-footer"]
<!-- /wp:shortcode -->

<!-- Discreet image-credits link (CC attribution for the location hero photos).
     Theme-level so it doesn't touch the shared Elementor footer template (164). -->
<!-- wp:html -->
<div class="bu-footer-credits" style="text-align:center;padding:10px 16px 16px;font-size:12px;">
	<a href="/image-credits/" style="color:rgba(100,116,139,.8);text-decoration:none;">Image credits</a>
</div>
<!-- /wp:html -->
